services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: risk_platform
      POSTGRES_USER: risk_user
      POSTGRES_PASSWORD: risk_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_user -d risk_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - risk_postgres_data:/var/lib/postgresql/data

volumes:
  risk_postgres_data:
